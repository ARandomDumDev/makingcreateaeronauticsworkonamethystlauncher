name: Ad-Hoc Sign Sable Dylib

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ad-hoc sign dylib
        run: |
          codesign --force --sign - libs/sable_rapier_aarch64_macos.dylib
          codesign --verify --verbose=2 libs/sable_rapier_aarch64_macos.dylib

      - name: Upload raw dylib to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-dylib
          name: Signed Sable Dylib
          files: libs/sable_rapier_aarch64_macos.dylib
