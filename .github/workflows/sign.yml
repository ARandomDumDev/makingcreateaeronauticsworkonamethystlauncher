
name: Sign Sable Native Dylib

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-jar:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Passwordless P12 Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_BASE64 }}

      - name: Extract, Patch, Sign Dylib, and Repackage JAR
        run: |
          mkdir -p work
          cd work
          unzip -q ../mods/sable-neoforge-1.21.1-2.0.6.jar

          DYLIB=$(find . -name "sable_rapier_aarch64_macos.dylib" -print -quit)
          if [ -z "$DYLIB" ]; then
            echo "Error: Could not find sable_rapier_aarch64_macos.dylib inside the JAR"
            exit 1
          fi
          echo "Found dylib at: $DYLIB"

          IDENTITY=$(security find-identity -v -p codesigning | grep -m 1 '"' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "Error: No valid code-signing identity found"
            exit 1
          fi
          echo "Signing with identity: $IDENTITY"

          vtool -set-build-version ios 15.0 15.0 -replace -output "$DYLIB" "$DYLIB"

          codesign --force --sign "$IDENTITY" "$DYLIB"
          codesign --verify --verbose=2 "$DYLIB"

          zip -qr ../sable-neoforge-1.21.1-2.0.6-signed.jar .

      - name: Upload Signed JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-sable
          name: Signed Sable Mod
          files: sable-neoforge-1.21.1-2.0.6-signed.jar
